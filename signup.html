<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | MindSense AI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page" style="
    margin:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
">

    <div class="auth-container" style="
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    box-sizing:border-box;
">

        <div class="loginBox auth-card">

            <a href="index.html" class="auth-back">
                ← Back to MindSense
            </a>

            <small>MINDSENSE AI</small>

            <h2>Create <i>account.</i></h2>

            <p>
                Create your unique User ID and password.
            </p>

            <input
                id="signupUsername"
                type="text"
                placeholder="Create User ID"
                autocomplete="username"
            >

            <input
                id="signupPassword"
                type="password"
                placeholder="Create Password"
                autocomplete="new-password"
            >

            <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm Password"
                autocomplete="new-password"
            >

            <button class="cta" id="signupBtn" type="button">
                Create Account
            </button>

            <p id="signupMessage"></p>

            <small>
                Already have an account?
                <a href="login.html" class="auth-link">
                    Login
                </a>
            </small>

        </div>

    </div>

    <script src="js/signup.js"></script>

</body>
</html>
